name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:
  tests:
    name: Docker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Prepare CI environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          cat >> .env << 'EOF'

          SECRET_KEY=github-actions-ci-secret-key
          DEBUG=True

          POSTGRES_DB=habits_test
          POSTGRES_USER=habits_user
          POSTGRES_PASSWORD=habits_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432

          REDIS_HOST=redis
          REDIS_PORT=6379

          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0

          CELERY_TASK_ALWAYS_EAGER=True
          CELERY_TASK_EAGER_PROPAGATES=True

          ALLOWED_HOSTS=localhost,127.0.0.1
          EOF


      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Build containers
        run: |
          docker compose build

      - name: Start containers
        run: |
          docker compose up -d

          echo "Waiting for containers..."
          sleep 15

          docker compose ps


      - name: Find Django service
        run: |
          DJANGO_SERVICE=""

          for service in $(docker compose config --services); do

            if docker compose exec -T "$service" \
              sh -c 'test -f manage.py' \
              >/dev/null 2>&1; then

              DJANGO_SERVICE="$service"
              break
            fi

          done

          if [ -z "$DJANGO_SERVICE" ]; then
            echo "Could not find Django container with manage.py"
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi

          echo "Django service: $DJANGO_SERVICE"

          echo "DJANGO_SERVICE=$DJANGO_SERVICE" >> "$GITHUB_ENV"

      - name: Django check
        run: |
          docker compose exec -T \
            "$DJANGO_SERVICE" \
            python manage.py check


      - name: Run migrations
        run: |
          docker compose exec -T \
            "$DJANGO_SERVICE" \
            python manage.py migrate --noinput

      - name: Run tests
        run: |
          docker compose exec -T \
            "$DJANGO_SERVICE" \
            python manage.py test

      - name: Show Docker logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans

  deploy:
    name: Deploy to Cloud.ru

    runs-on: ubuntu-latest

    needs:
      - tests

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Check SSH connection
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            '
              echo "SSH connection successful"
              whoami
              docker --version
              docker compose version
            '

      - name: Prepare deploy directory
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "mkdir -p '$DEPLOY_DIR'"


      - name: Upload project
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          rsync \
            -az \
            --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude=".venv/" \
            --exclude="venv/" \
            --exclude="__pycache__/" \
            --exclude=".pytest_cache/" \
            --exclude=".coverage" \
            --exclude="htmlcov/" \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key" \
            ./ \
            "$SSH_USER@$SERVER_IP:$DEPLOY_DIR/"

      - name: Deploy Docker containers
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "DEPLOY_DIR='$DEPLOY_DIR' bash -s" << 'EOF'

          set -e

          cd "$DEPLOY_DIR"

          echo "======================================="
          echo "Deploying WPA Habits"
          echo "======================================="

          if [ ! -f .env ]; then
            echo "ERROR: $DEPLOY_DIR/.env not found"
            exit 1
          fi

          echo "Stopping old containers..."

          docker compose down --remove-orphans


          echo "Building new containers..."

          docker compose build


          echo "Starting containers..."

          docker compose up -d


          echo "Waiting for containers..."

          sleep 15


          echo "Containers:"

          docker compose ps

          EOF

      - name: Check deployed containers
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "cd '$DEPLOY_DIR' && docker compose ps"


      - name: Health check
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |

          echo "Checking application..."

          for attempt in {1..10}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://$SERVER_IP/health/"; then

              echo
              echo "Application is healthy"
              exit 0

            fi

            echo "Attempt $attempt failed"

            sleep 5

          done

          echo "Health check failed"
          exit 1

      - name: Show deployment logs
        if: failure()
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "
              cd '$DEPLOY_DIR' &&
              docker compose ps &&
              docker compose logs --tail=200
            " || true