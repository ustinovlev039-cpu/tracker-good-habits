name: Habit Tracker CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789-0123456789
      DEBUG: "False"
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_BOT_USERNAME: test_bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django system check
        run: python manage.py check --settings=config.settings_test

      - name: Check migrations
        run: >-
          python manage.py makemigrations
          --check
          --dry-run
          --settings=config.settings_test

      - name: Run tests with coverage
        run: |
          coverage erase
          coverage run manage.py test --settings=config.settings_test
          coverage report

      - name: Validate OpenAPI schema
        run: >-
          python manage.py spectacular
          --settings=config.settings_test
          --file /tmp/habit-tracker-schema.yml
          --validate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: >-
          env ENV_FILE=.env.template
          docker compose
          --env-file .env.template
          config
          --quiet

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build application image
        run: docker build --tag "habit-tracker:${GITHUB_SHA}" .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: habit-tracker-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/habit_tracker_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/habit_tracker_deploy ~/.ssh/known_hosts
          test -s ~/.ssh/habit_tracker_deploy
          test -s ~/.ssh/known_hosts

      - name: Check SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: >-
          ssh
          -o BatchMode=yes
          -i ~/.ssh/habit_tracker_deploy
          -p "$SERVER_PORT"
          "$SERVER_USER@$SERVER_HOST"
          "echo 'SSH connection successful'"

      - name: Prepare project directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: >-
          ssh
          -o BatchMode=yes
          -i ~/.ssh/habit_tracker_deploy
          -p "$SERVER_PORT"
          "$SERVER_USER@$SERVER_HOST"
          "mkdir -p '$DEPLOY_PATH'"

      - name: Copy project to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            --filter='P .env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.coverage' \
            --exclude='coverage.xml' \
            --exclude='htmlcov/' \
            --exclude='staticfiles/' \
            --exclude='media/' \
            --exclude='celerybeat-schedule*' \
            -e "ssh -o BatchMode=yes -i ~/.ssh/habit_tracker_deploy -p $SERVER_PORT" \
            ./ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      - name: Upload production environment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          printf '%s\n' "$PRODUCTION_ENV" | ssh \
            -o BatchMode=yes \
            -i ~/.ssh/habit_tracker_deploy \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "umask 077; cat > '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env'"

      - name: Build and start application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/habit_tracker_deploy \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$DEPLOY_PATH'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"

          test -s .env
          docker compose config --quiet
          docker compose up --detach --build --remove-orphans

          for attempt in $(seq 1 30); do
            if docker compose exec -T nginx \
              wget --quiet --tries=1 --spider http://127.0.0.1/health/; then
              docker compose ps
              docker image prune --force
              exit 0
            fi

            echo "Healthcheck attempt ${attempt}/30"
            sleep 5
          done

          docker compose ps
          docker compose logs --tail=150
          exit 1
          REMOTE_SCRIPT
