name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: |
          python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: |
          python manage.py test


  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: tests

    # Деплоим только push в main.
    # Pull Request на сервер не выкатываем.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check SSH connection
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            'echo "SSH connection successful"; whoami; docker --version; docker compose version'


      # -------------------------------------------------------
      # Проверяем/создаём каталог проекта
      # -------------------------------------------------------
      - name: Prepare deploy directory
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "mkdir -p '$DEPLOY_DIR'"

      - name: Upload project
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e

          rsync \
            -az \
            --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude=".venv/" \
            --exclude="venv/" \
            --exclude="__pycache__/" \
            --exclude=".pytest_cache/" \
            --exclude=".coverage" \
            --exclude="htmlcov/" \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key" \
            ./ \
            "$SSH_USER@$SERVER_IP:$DEPLOY_DIR/"


      # -------------------------------------------------------
      # Запускаем приложение через Docker Compose
      # -------------------------------------------------------
      - name: Deploy application
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "DEPLOY_DIR='$DEPLOY_DIR' bash -s" << 'EOF'

          set -e

          cd "$DEPLOY_DIR"

          echo "========================================"
          echo "Starting WPA Habits deployment"
          echo "Directory: $DEPLOY_DIR"
          echo "========================================"

          if [ ! -f docker-compose.yml ] && \
             [ ! -f docker-compose.yaml ] && \
             [ ! -f compose.yml ] && \
             [ ! -f compose.yaml ]; then

            echo "Docker Compose file not found"
            exit 1
          fi

          if [ ! -f .env ]; then
            echo "ERROR: $DEPLOY_DIR/.env does not exist"
            echo "Create .env on the server before deployment."
            exit 1
          fi

          echo "Stopping old containers..."
          docker compose down --remove-orphans

          echo "Building containers..."
          docker compose build

          echo "Starting containers..."
          docker compose up -d

          echo "Current containers:"
          docker compose ps

          EOF


      # -------------------------------------------------------
      # Даём контейнерам время запуститься
      # -------------------------------------------------------
      - name: Wait for application
        run: sleep 15


      # -------------------------------------------------------
      # Показываем состояние контейнеров
      # -------------------------------------------------------
      - name: Check containers
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "cd '$DEPLOY_DIR' && docker compose ps"


      # -------------------------------------------------------
      # Проверка health endpoint
      # -------------------------------------------------------
      - name: Health check
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e

          echo "Checking http://$SERVER_IP/health/"

          for attempt in {1..10}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://$SERVER_IP/health/"; then

              echo
              echo "Health check successful"
              exit 0
            fi

            echo "Health check attempt $attempt/10 failed"

            sleep 5
          done

          echo "Application health check failed"
          exit 1


      # -------------------------------------------------------
      # Логи при неудачном деплое
      # -------------------------------------------------------
      - name: Show Docker logs on failure
        if: failure()
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "cd '$DEPLOY_DIR' && docker compose ps && docker compose logs --tail=200" \
            || true