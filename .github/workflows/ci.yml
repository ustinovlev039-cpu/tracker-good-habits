name: CI/CD

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: |
          ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: ci-test-secret-key-only-0123456789-0123456789
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test

      # Для CI используем SQLite.
      # config/settings_test.py уже это поддерживает.
      USE_SQLITE_FOR_TESTS: "True"

      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_BOT_USERNAME: test_bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system check
        run: |
          python manage.py check \
            --settings=config.settings_test

      - name: Check migrations
        run: |
          python manage.py makemigrations \
            --check \
            --dry-run \
            --settings=config.settings_test

      - name: Run tests
        run: |
          coverage erase

          coverage run \
            manage.py test \
            --settings=config.settings_test

          coverage report

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular \
            --settings=config.settings_test \
            --file /tmp/habit-tracker-schema.yml \
            --validate

  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker environment
        run: |
          cp .env.example .env

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Check Dockerfile
        run: |
          docker build --check .

      - name: Build Docker image
        run: |
          docker build \
            --tag "habit-tracker:${GITHUB_SHA}" \
            .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs:
      - lint
      - tests
      - docker_build

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    concurrency:
      group: habit-tracker-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -H \
            "$SERVER_IP" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          test -s ~/.ssh/deploy_key
          test -s ~/.ssh/known_hosts

      - name: Check SSH connection
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            '
              echo "SSH connection successful"
              whoami
              docker --version
              docker compose version
            '

      - name: Prepare deploy directory
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "mkdir -p '$DEPLOY_DIR'"

      - name: Copy project to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            --filter='P .env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.coverage' \
            --exclude='coverage.xml' \
            --exclude='htmlcov/' \
            --exclude='staticfiles/' \
            --exclude='media/' \
            --exclude='celerybeat-schedule*' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key" \
            ./ \
            "$SSH_USER@$SERVER_IP:$DEPLOY_DIR/"

      - name: Build and start application
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "bash -s -- '$DEPLOY_DIR'" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          DEPLOY_DIR="$1"

          cd "$DEPLOY_DIR"

          echo "======================================"
          echo "Deploying Habit Tracker"
          echo "Directory: $DEPLOY_DIR"
          echo "======================================"

          if [ ! -s .env ]; then
            echo "ERROR: $DEPLOY_DIR/.env does not exist"
            echo "Create production .env on the server."
            exit 1
          fi

          echo "Validating Docker Compose..."

          docker compose config --quiet

          echo "Building and starting containers..."

          docker compose up \
            --detach \
            --build \
            --remove-orphans

          echo "Waiting for application..."

          for attempt in $(seq 1 30); do

            if docker compose exec -T nginx \
              wget \
                --quiet \
                --tries=1 \
                --spider \
                http://127.0.0.1/health/; then

              echo "Application is healthy"

              docker compose ps

              docker image prune --force

              exit 0
            fi

            echo "Health check attempt ${attempt}/30"

            sleep 5

          done

          echo "Application failed health check"

          docker compose ps
          docker compose logs --tail=200

          exit 1

          REMOTE_SCRIPT

        
      - name: Verify deployed containers
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SERVER_IP" \
            "
              cd '$DEPLOY_DIR'

              echo '=============================='
              echo 'Running containers'
              echo '=============================='

              docker compose ps
            "