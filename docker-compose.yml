services:
  db:
    image: postgres:16-alpine
    container_name: habit_tracker_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habit_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-habit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habit_password}

    expose: 
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-habit_user} -d ${POSTGRES_DB:-habit_tracker}
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: habit_tracker_redis
    restart: unless-stopped

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10


  web:
    build: .
    container_name: habit_tracker_web
    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      "

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    ports:
      - "8000:8000"

    volumes:
      - static_data:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery_worker:
    build: .
    container_name: habit_tracker_celery_worker
    restart: unless-stopped

    command: celery -A config worker --loglevel=info

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery_beat:
    build: .
    container_name: habit_tracker_celery_beat
    restart: unless-stopped

    command: celery -A config beat --loglevel=info

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  telegram_bot:
    build: .
    container_name: habit_tracker_telegram_bot
    restart: unless-stopped

    command: python manage.py run_telegram_bot

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
  static_data: