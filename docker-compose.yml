name: habit-tracker

x-app: &app
  image: habit-tracker-app:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${ENV_FILE:-.env}
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    init: true
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/", timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  celery:
    <<: *app
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A config inspect ping
          --destination "celery@$$HOSTNAME"
          --timeout 5 | grep -q pong
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  celery-beat:
    <<: *app
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  telegram-bot:
    <<: *app
    restart: unless-stopped
    init: true
    command:
      - sh
      - -c
      - >-
        if [ -z "$${TELEGRAM_BOT_TOKEN:-}" ]; then
          echo "TELEGRAM_BOT_TOKEN is empty; Telegram polling is disabled";
          exec sleep infinity;
        fi;
        exec python manage.py run_telegram_bot
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/health/
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  celery_beat_data:
